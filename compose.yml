services:
  db:
    image: postgres:15
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=elisterdb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=rootadmin
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d elisterdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://postgres:rootadmin@db:5432/elisterdb
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
