{% extends "administrator/shared/base.html" %} {% block title %}Add Category
{%endblock %} 
{% block content %}
<div class="container-fluid">
  <div class="row">
    <div class="col-md-6">
      <h4 class="mb-4">Create Content Category</h4>

      <form method="post">
        {% csrf_token %} 

      
        
        <div class="mb-3">
    <label class="form-label">Category Name</label>
    <input type="text" name="name" class="form-control"
           value="{{ form.name.value|default:'' }}">
</div>

<div class="mb-3">
    <label class="form-label">Description</label>
    <textarea name="description" class="form-control" rows="4">{{ form.description.value|default:'' }}</textarea>
</div>

<div class="form-check mb-3">
    <input type="checkbox" name="is_active" class="form-check-input"
           {% if form.is_active.value %}checked{% endif %}>
    <label class="form-check-label">Active</label>
</div>
        
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{% url 'administrator:dashboard' %}" class="btn btn-secondary">
          Cancel
        </a>
      </form>
    </div>
  </div>
</div>

{% endblock %}
