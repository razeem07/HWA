{% extends "administrator/shared/base.html" %}
{% block title %}Booking List{% endblock %}


{% block content %}

<h2>Newsletter Subscribers</h2>

<table border="1" cellpadding="10">
  <tr>
    <th>Email</th>
    <th>Subscribed On</th>
    <th>Action</th>
  </tr>

  {% for sub in subscribers %}
  <tr>
    <td>{{ sub.email }}</td>
    <td>{{ sub.created_at|date:"d M Y" }}</td>
    <td>
      <form method="post" action="{% url 'administrator:delete_subscriber' sub.id %}" onsubmit="return confirm('Delete this subscriber?');">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger btn-sm">Delete</button>
      </form>
    </td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
