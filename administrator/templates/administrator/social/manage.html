{% extends "administrator/shared/base.html" %}
{% block title %}Manage Social Link{% endblock %}

{% block content %}

<div class="container-fluid">

<h4 class="mb-4">Manage Social Link</h4>

<form method="post">
{% csrf_token %}

<div class="accordion">

<div class="accordion-item">

<h2 class="accordion-header">
<button type="button" class="accordion-button">
Social Link Details
</button>
</h2>

<div class="accordion-body">

<div class="row g-3">

<div class="col-md-6">
<label>Platform</label>
{{ form.name }}
</div>

<div class="col-md-6">
<label>URL</label>
<input type="text" name="url" class="form-control" value="{{ form.url.value|default:'' }}">
</div>

<div class="col-md-6">
<label>Icon Class</label>
<input type="text" name="icon_class" class="form-control" value="{{ form.icon_class.value|default:'' }}">
</div>

<div class="col-md-3">
<label>Order</label>
<input type="number" name="order" class="form-control" value="{{ form.order.value|default:'0' }}">
</div>

<div class="col-md-3 form-check mt-4">
<input type="checkbox" name="is_active" class="form-check-input"
{% if form.is_active.value %}checked{% endif %}>
<label class="form-check-label">Active</label>
</div>

</div>

</div>

</div>

</div>

<div class="mt-4">
<button type="submit" class="btn btn-success">Save</button>
<a href="{% url 'administrator:social-list' %}" class="btn btn-secondary">Cancel</a>
</div>

</form>

</div>

{% endblock %}
